<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Concept 4: CT monogram inside tile-shaped frame -->
  <!-- Letterform-driven mark. Tile-shaped frame contains "CT" in elegant serif. -->
  <!-- Reads as a brand mark even without explicit tile reference. -->

  <defs>
    <linearGradient id="t4Face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>
    <filter id="t4Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FBF7F0"/>

  <g filter="url(#t4Shadow)">
    <rect x="115" y="65" width="170" height="240" rx="22" fill="url(#t4Face)" stroke="#C9BFA8" stroke-width="3"/>
    <rect x="125" y="75" width="150" height="220" rx="16" fill="none" stroke="#E2D9C2" stroke-width="1.5"/>
  </g>

  <!-- CT monogram in serif, crimson -->
  <g transform="translate(200, 220)">
    <text x="0" y="0" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="170" fill="#9E1B32" text-anchor="middle" font-weight="600" letter-spacing="-8">CT</text>
    <!-- thin underline accent -->
    <line x1="-50" y1="40" x2="50" y2="40" stroke="#9E1B32" stroke-width="2"/>
  </g>
</svg>
