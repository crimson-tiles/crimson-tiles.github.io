<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Concept 2: 中 (chun / red dragon) tile -->
  <!-- The most distinctively riichi tile. Pure crimson character on cream. -->
  <!-- Strong, simple, instantly readable to riichi players. -->

  <defs>
    <linearGradient id="t2Face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>
    <filter id="t2Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FBF7F0"/>

  <g filter="url(#t2Shadow)">
    <rect x="115" y="65" width="170" height="240" rx="22" fill="url(#t2Face)" stroke="#C9BFA8" stroke-width="3"/>
    <rect x="125" y="75" width="150" height="220" rx="16" fill="none" stroke="#E2D9C2" stroke-width="1.5"/>
  </g>

  <!-- 中 character, crimson, centered -->
  <text x="200" y="245" font-family="'Noto Serif CJK SC', 'Songti SC', 'STSong', serif" font-size="180" fill="#9E1B32" text-anchor="middle" font-weight="700">中</text>
</svg>
