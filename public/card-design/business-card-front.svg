<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="525" height="300">
  <!-- US standard business card: 3.5" x 2" at 300dpi = 1050 x 600 px -->

  <defs>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="3" dy="5" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="paperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>

    <linearGradient id="tileFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>

    <symbol id="tileBody" viewBox="0 0 110 150">
      <rect x="0" y="0" width="110" height="150" rx="14" fill="url(#tileFace)" stroke="#C9BFA8" stroke-width="2"/>
      <rect x="6" y="6" width="98" height="138" rx="9" fill="none" stroke="#E2D9C2" stroke-width="1"/>
    </symbol>
  </defs>

  <rect width="1050" height="600" fill="url(#paperBg)"/>
  <rect x="0" y="0" width="6" height="600" fill="#9E1B32"/>

  <!-- decorative tile cluster, subtle -->
  <g opacity="0.10" transform="translate(720, 360)">
    <g transform="rotate(-8) translate(0, 0)"><use href="#tileBody" width="110" height="150"/></g>
    <g transform="rotate(4) translate(85, 10)"><use href="#tileBody" width="110" height="150"/></g>
    <g transform="rotate(12) translate(170, 30)"><use href="#tileBody" width="110" height="150"/></g>
  </g>

  <!-- hero 1-pin tile -->
  <g transform="translate(110, 175) rotate(-6)" filter="url(#tileShadow)">
    <use href="#tileBody" width="170" height="232"/>
    <g transform="translate(85, 116)">
      <circle r="55" fill="none" stroke="#9E1B32" stroke-width="6"/>
      <circle r="44" fill="#FFFCF6" stroke="#C9BFA8" stroke-width="1.5"/>
      <g fill="#9E1B32">
        <circle r="6" cx="0" cy="-32"/>
        <circle r="6" cx="0" cy="32"/>
        <circle r="6" cx="-32" cy="0"/>
        <circle r="6" cx="32" cy="0"/>
        <circle r="5" cx="-22" cy="-22"/>
        <circle r="5" cx="22" cy="-22"/>
        <circle r="5" cx="-22" cy="22"/>
        <circle r="5" cx="22" cy="22"/>
      </g>
      <circle r="9" fill="#1a1a1a"/>
    </g>
  </g>

  <text x="370" y="200" font-family="'Cormorant Garamond', 'EB Garamond', Georgia, serif" font-size="98" fill="#1a1a1a" font-weight="600" letter-spacing="-3">Crimson Tiles</text>
  <text x="372" y="248" font-family="'Cormorant Garamond', Georgia, serif" font-size="28" fill="#9E1B32" font-style="italic" letter-spacing="1.5">riichi mahjong · the university of alabama</text>
  <line x1="372" y1="280" x2="540" y2="280" stroke="#9E1B32" stroke-width="1"/>
  <text x="372" y="340" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="22" fill="#666" letter-spacing="0.5">crimson-tiles.github.io</text>

  <!-- QR -->
  <g transform="translate(845, 410)">
    <rect width="140" height="140" fill="#FFFCF6" stroke="#1a1a1a" stroke-width="1.5"/>
    <g fill="#1a1a1a">
      <rect x="8" y="8" width="34" height="34"/>
      <rect x="14" y="14" width="22" height="22" fill="#FFFCF6"/>
      <rect x="19" y="19" width="12" height="12"/>
      <rect x="98" y="8" width="34" height="34"/>
      <rect x="104" y="14" width="22" height="22" fill="#FFFCF6"/>
      <rect x="109" y="19" width="12" height="12"/>
      <rect x="8" y="98" width="34" height="34"/>
      <rect x="14" y="104" width="22" height="22" fill="#FFFCF6"/>
      <rect x="19" y="109" width="12" height="12"/>
      <rect x="50" y="10" width="6" height="6"/>
      <rect x="62" y="18" width="6" height="6"/>
      <rect x="74" y="10" width="6" height="6"/>
      <rect x="86" y="18" width="6" height="6"/>
      <rect x="50" y="30" width="12" height="6"/>
      <rect x="74" y="30" width="6" height="12"/>
      <rect x="86" y="30" width="6" height="6"/>
      <rect x="50" y="50" width="6" height="12"/>
      <rect x="62" y="56" width="6" height="6"/>
      <rect x="74" y="50" width="12" height="6"/>
      <rect x="92" y="56" width="6" height="6"/>
      <rect x="104" y="50" width="6" height="12"/>
      <rect x="116" y="56" width="6" height="6"/>
      <rect x="50" y="70" width="6" height="6"/>
      <rect x="62" y="76" width="12" height="6"/>
      <rect x="80" y="68" width="6" height="6"/>
      <rect x="92" y="76" width="6" height="6"/>
      <rect x="104" y="70" width="6" height="12"/>
      <rect x="50" y="90" width="6" height="12"/>
      <rect x="62" y="96" width="6" height="6"/>
      <rect x="74" y="90" width="12" height="6"/>
      <rect x="92" y="96" width="6" height="12"/>
      <rect x="104" y="92" width="6" height="6"/>
      <rect x="116" y="100" width="6" height="6"/>
      <rect x="50" y="110" width="12" height="6"/>
      <rect x="68" y="116" width="6" height="6"/>
      <rect x="80" y="110" width="6" height="6"/>
      <rect x="92" y="116" width="12" height="6"/>
      <rect x="110" y="110" width="6" height="12"/>
      <rect x="122" y="116" width="6" height="6"/>
    </g>
  </g>

  <text x="915" y="575" font-family="Georgia, serif" font-size="14" fill="#888" text-anchor="middle" font-style="italic">scan</text>
</svg>
