<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Concept 1: 1-pin tile emblem -->
  <!-- The most iconic single tile in riichi. Tile shape contains the ornate 1-pin face. -->

  <defs>
    <linearGradient id="t1Face" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>
    <filter id="t1Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.20"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#FBF7F0"/>

  <g filter="url(#t1Shadow)">
    <rect x="115" y="65" width="170" height="240" rx="22" fill="url(#t1Face)" stroke="#C9BFA8" stroke-width="3"/>
    <rect x="125" y="75" width="150" height="220" rx="16" fill="none" stroke="#E2D9C2" stroke-width="1.5"/>
  </g>

  <g transform="translate(200, 185)">
    <circle r="80" fill="none" stroke="#9E1B32" stroke-width="9"/>
    <circle r="64" fill="#FFFCF6" stroke="#C9BFA8" stroke-width="2"/>
    <g fill="#9E1B32">
      <circle r="9" cx="0" cy="-46"/>
      <circle r="9" cx="0" cy="46"/>
      <circle r="9" cx="-46" cy="0"/>
      <circle r="9" cx="46" cy="0"/>
      <circle r="7.5" cx="-32" cy="-32"/>
      <circle r="7.5" cx="32" cy="-32"/>
      <circle r="7.5" cx="-32" cy="32"/>
      <circle r="7.5" cx="32" cy="32"/>
    </g>
    <circle r="13" fill="#1a1a1a"/>
  </g>
</svg>
