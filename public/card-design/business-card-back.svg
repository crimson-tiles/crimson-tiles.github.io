<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="525" height="300">
  <!-- Back of business card -->

  <defs>
    <filter id="tileShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="3" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <linearGradient id="paperBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F0"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </linearGradient>

    <linearGradient id="tileFace2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFCF6"/>
      <stop offset="100%" stop-color="#F2EBDC"/>
    </linearGradient>

    <symbol id="tileBody2" viewBox="0 0 110 150">
      <rect x="0" y="0" width="110" height="150" rx="14" fill="url(#tileFace2)" stroke="#C9BFA8" stroke-width="2"/>
      <rect x="6" y="6" width="98" height="138" rx="9" fill="none" stroke="#E2D9C2" stroke-width="1"/>
    </symbol>

    <!-- single dot for pin tiles - properly drawn with crimson outer + tiny inner -->
    <symbol id="pinDot" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10" fill="none" stroke="#9E1B32" stroke-width="2.5"/>
      <circle cx="12" cy="12" r="3.5" fill="#9E1B32"/>
    </symbol>
  </defs>

  <rect width="1050" height="600" fill="url(#paperBg2)"/>

  <!-- thin crimson hairline at left to match front -->
  <rect x="0" y="0" width="6" height="600" fill="#9E1B32"/>

  <!-- Title - kept light, no heavy bar -->
  <text x="60" y="90" font-family="'Cormorant Garamond', Georgia, serif" font-size="44" fill="#1a1a1a" font-weight="600" letter-spacing="-1">Mini-Mahjong</text>
  <text x="60" y="125" font-family="'Cormorant Garamond', Georgia, serif" font-size="22" fill="#9E1B32" font-style="italic" letter-spacing="1">five tiles · one suit · learn it in five minutes</text>

  <!-- Thin separator under title -->
  <line x1="60" y1="148" x2="240" y2="148" stroke="#9E1B32" stroke-width="1"/>

  <!-- TILE ROW: 4-pin, 5-pin, 6-pin, +, 3-pin, 3-pin -->
  <!-- Tiles are 100x140 each, smaller than v1 to leave breathing room -->

  <!-- 4-pin -->
  <g transform="translate(70, 200)" filter="url(#tileShadow2)">
    <use href="#tileBody2" width="100" height="140"/>
    <use href="#pinDot" x="22" y="30" width="22" height="22"/>
    <use href="#pinDot" x="56" y="30" width="22" height="22"/>
    <use href="#pinDot" x="22" y="88" width="22" height="22"/>
    <use href="#pinDot" x="56" y="88" width="22" height="22"/>
  </g>

  <!-- 5-pin -->
  <g transform="translate(190, 200)" filter="url(#tileShadow2)">
    <use href="#tileBody2" width="100" height="140"/>
    <use href="#pinDot" x="22" y="22" width="22" height="22"/>
    <use href="#pinDot" x="56" y="22" width="22" height="22"/>
    <use href="#pinDot" x="39" y="59" width="22" height="22"/>
    <use href="#pinDot" x="22" y="96" width="22" height="22"/>
    <use href="#pinDot" x="56" y="96" width="22" height="22"/>
  </g>

  <!-- 6-pin -->
  <g transform="translate(310, 200)" filter="url(#tileShadow2)">
    <use href="#tileBody2" width="100" height="140"/>
    <use href="#pinDot" x="18" y="22" width="22" height="22"/>
    <use href="#pinDot" x="60" y="22" width="22" height="22"/>
    <use href="#pinDot" x="18" y="59" width="22" height="22"/>
    <use href="#pinDot" x="60" y="59" width="22" height="22"/>
    <use href="#pinDot" x="18" y="96" width="22" height="22"/>
    <use href="#pinDot" x="60" y="96" width="22" height="22"/>
  </g>

  <!-- run label -->
  <text x="245" y="370" font-family="Georgia, serif" font-size="14" fill="#888" font-style="italic" text-anchor="middle">a run · 4-5-6</text>

  <!-- + separator -->
  <text x="445" y="280" font-family="Georgia, serif" font-size="36" fill="#C9BFA8" text-anchor="middle">+</text>

  <!-- 3-pin -->
  <g transform="translate(490, 200)" filter="url(#tileShadow2)">
    <use href="#tileBody2" width="100" height="140"/>
    <use href="#pinDot" x="18" y="22" width="22" height="22"/>
    <use href="#pinDot" x="39" y="59" width="22" height="22"/>
    <use href="#pinDot" x="60" y="96" width="22" height="22"/>
  </g>

  <!-- 3-pin (matching) -->
  <g transform="translate(610, 200)" filter="url(#tileShadow2)">
    <use href="#tileBody2" width="100" height="140"/>
    <use href="#pinDot" x="18" y="22" width="22" height="22"/>
    <use href="#pinDot" x="39" y="59" width="22" height="22"/>
    <use href="#pinDot" x="60" y="96" width="22" height="22"/>
  </g>

  <!-- pair label -->
  <text x="660" y="370" font-family="Georgia, serif" font-size="14" fill="#888" font-style="italic" text-anchor="middle">a pair · two of one</text>

  <!-- Right side callout -->
  <g transform="translate(800, 215)">
    <text x="0" y="0" font-family="'Cormorant Garamond', Georgia, serif" font-size="56" fill="#9E1B32" font-weight="600" letter-spacing="-1">= mahjong</text>
    <text x="0" y="40" font-family="Georgia, serif" font-size="16" fill="#888" font-style="italic">the smallest possible hand</text>
    <line x1="0" y1="65" x2="180" y2="65" stroke="#C9BFA8" stroke-width="1"/>
    <text x="0" y="100" font-family="Georgia, serif" font-size="14" fill="#666">real riichi: 14 tiles,</text>
    <text x="0" y="120" font-family="Georgia, serif" font-size="14" fill="#666">3 suits, 4 sets + 1 pair</text>
  </g>

  <!-- Bottom: gentle CTA, no heavy bar -->
  <text x="60" y="540" font-family="'Cormorant Garamond', Georgia, serif" font-size="26" fill="#1a1a1a" font-style="italic">come play with us at the demo table.</text>
  <text x="60" y="572" font-family="'IBM Plex Mono', 'Courier New', monospace" font-size="14" fill="#888" letter-spacing="0.5">crimson-tiles.github.io · discord linked there</text>
</svg>
